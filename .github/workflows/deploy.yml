name: 构建并部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:          # 也支持在 Actions 页面手动触发

# GITHUB_TOKEN 的权限：部署 Pages 需要这三项
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；新的推送取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 和本地保持一致。主题要求 Hugo extended ≥ 0.155
      # （需要 js.Build 打包 ES 模块，以及 Image.Meta 读 EXIF）
      HUGO_VERSION: 0.167.0
    steps:
      # 必须在 checkout 之前：.gitmodules 里主题用的是 SSH 地址
      # （git@github.com:...），而 Actions 里没有 SSH key，
      # 直接拉子模块会认证失败。这条让 git 自动改写成 HTTPS。
      # 仓库是公开的，HTTPS 匿名可读。
      - name: 让 git 把 SSH 子模块地址改写成 HTTPS
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: 检出代码（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0          # Hugo 要读 git 历史来算 .Lastmod

      - name: 安装 Hugo extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: 配置 Pages
        id: pages
        uses: actions/configure-pages@v5

      # --baseURL 用 Pages 实际地址覆盖 hugo.toml 里的值，
      # 这样换成自定义域名时不用改仓库
      - name: 构建
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
